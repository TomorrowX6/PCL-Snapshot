name: Build reconstructed PCL snapshot

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Check out reconstructed source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build and package
        shell: pwsh
        run: .\build.ps1 -Configuration ${{ matrix.configuration }}
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: PCL2-Snapshot-${{ matrix.configuration }}
          path: |
            artifacts/PCL2-Snapshot-${{ matrix.configuration }}.zip
            artifacts/PCL2-Snapshot-${{ matrix.configuration }}.zip.sha256
          if-no-files-found: error
